# Complete checkpoints sharing the same base, architecture and vocabulary.
merge_method: opcm
base_model: /root/autodl-fs/data/models/base
models:
  - model: /root/autodl-fs/data/models/gigpo-webshop
  - model: /root/autodl-fs/data/models/toolrl
  - model: /root/autodl-fs/data/models/research
  - model: /root/autodl-fs/data/models/gigpo-alfworld
dtype: float32
parameters:
  alpha: 0.5
  shuffle_order: false
  seed: 42
  save_on_every_step: false
