# Complete checkpoints sharing the same base, architecture and vocabulary.
merge_method: opcm
base_model: base
models:
  - model: gigpo-webshop
  - model: toolrl
  - model: research
  - model: gigpo-alfworld
dtype: float32
parameters:
  alpha: 0.5
  shuffle_order: false
  seed: 42
  save_on_every_step: false
